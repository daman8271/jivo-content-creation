<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JIVO Logo Reveal</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #071f15; }

      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #071f15;
      }

      /* Whole stage jitters on impact. Oversized so the shake never
         reveals empty edges. */
      .stage-shake {
        position: absolute;
        inset: -90px;
        will-change: transform;
      }

      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 44%, #18472f 0%, #0e3221 48%, #071f15 100%);
      }

      /* edge vignette for depth */
      .vignette {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 50% 44%, rgba(0,0,0,0) 42%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
      }

      /* everything that lives at the badge's center point */
      .fx {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 0;
        height: 0;
        transform: translate(-50%, -50%);
      }

      /* soft glow behind the badge */
      .glow {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1180px;
        height: 1180px;
        margin: -590px 0 0 -590px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(120,240,170,0.55) 0%, rgba(90,220,150,0.18) 38%, rgba(90,220,150,0) 68%);
        opacity: 0;
      }

      /* "charging" pre-impact glow */
      .charge {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 820px;
        height: 820px;
        margin: -410px 0 0 -410px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(190,255,215,0.85) 0%, rgba(120,240,170,0.25) 45%, rgba(120,240,170,0) 70%);
        opacity: 0;
      }

      /* expanding shockwave rings */
      .ring {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 760px;
        height: 760px;
        margin: -380px 0 0 -380px;
        border-radius: 50%;
        border: 6px solid rgba(214,255,229,0.9);
        opacity: 0;
      }
      .ring.r2 {
        border-color: rgba(120,240,170,0.8);
        border-width: 4px;
      }

      /* radial burst spokes */
      .burst {
        position: absolute;
        left: 50%;
        top: 50%;
        transform-origin: 0 0;
      }
      .burst-bar {
        position: absolute;
        width: 7px;
        border-radius: 4px;
        background: linear-gradient(to top, rgba(120,240,170,0) 0%, rgba(180,255,210,0.95) 100%);
        opacity: 0;
      }

      .badge-wrap {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 760px;
        height: 760px;
        margin: -380px 0 0 -380px;
        will-change: transform, opacity;
      }
      .badge {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 24px 60px rgba(0,0,0,0.45));
      }

      /* full-frame impact flash, sits above everything */
      .flash {
        position: absolute;
        inset: 0;
        background: #ffffff;
        opacity: 0;
        z-index: 50;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="root" data-width="1080" data-height="1920" data-start="0" data-duration="3.4">
      <div class="stage-shake">
        <div class="bg"></div>

        <div class="glow"></div>
        <div class="charge"></div>

        <div class="fx" id="fx"></div>

        <div class="ring r1"></div>
        <div class="ring r2"></div>

        <div class="badge-wrap">
          <img class="badge" src="logo-cut.png" alt="JIVO" crossorigin="anonymous" />
        </div>

        <div class="vignette"></div>
      </div>

      <div class="flash"></div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
      <script>
        // Deterministic PRNG — no Math.random in render.
        function mulberry32(a) {
          return function () {
            a |= 0; a = (a + 0x6d2b79f5) | 0;
            let t = Math.imul(a ^ (a >>> 15), 1 | a);
            t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          };
        }
        const rand = mulberry32(7);

        // Build burst spokes deterministically.
        const fx = document.getElementById("fx");
        const N = 14;
        const bars = [];
        for (let i = 0; i < N; i++) {
          const baseAngle = (360 / N) * i;
          const angle = baseAngle + (rand() - 0.5) * 14;
          const len = 90 + rand() * 90;
          const spoke = document.createElement("div");
          spoke.className = "burst";
          spoke.style.transform = "rotate(" + angle + "deg)";
          const bar = document.createElement("div");
          bar.className = "burst-bar";
          bar.style.height = len + "px";
          // place bar pointing "up" from origin, then rotate via parent
          bar.style.left = "-3.5px";
          bar.style.bottom = "0px";
          spoke.appendChild(bar);
          fx.appendChild(spoke);
          bars.push(bar);
        }

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        const IMPACT = 0.5;

        // --- Anticipation: charge glow builds, then collapses into impact ---
        tl.fromTo(".charge",
          { opacity: 0, scale: 0.55 },
          { opacity: 0.7, scale: 1.0, duration: 0.34, ease: "power2.in", immediateRender: false },
          0.14
        );
        tl.to(".charge", { opacity: 0, scale: 1.25, duration: 0.18, ease: "power3.out", overwrite: "auto" }, IMPACT);

        // --- IMPACT: badge slams in (big -> settle via back overshoot) ---
        tl.from(".badge-wrap", { scale: 1.75, duration: 0.52, ease: "back.out(1.7)" }, IMPACT);
        tl.from(".badge-wrap", { opacity: 0, duration: 0.12, ease: "power2.out" }, IMPACT);

        // --- White impact flash ---
        tl.fromTo(".flash",
          { opacity: 0 },
          { opacity: 0.92, duration: 0.05, ease: "power2.out", immediateRender: false },
          IMPACT + 0.02
        );
        tl.to(".flash", { opacity: 0, duration: 0.36, ease: "power2.in", overwrite: "auto" }, IMPACT + 0.08);

        // --- Screen shake (decaying jitter on whole stage) ---
        tl.to(".stage-shake", {
          keyframes: { x: [0, -16, 13, -9, 6, -3, 0], y: [0, 11, -8, 5, -3, 0, 0] },
          duration: 0.34, ease: "none",
        }, IMPACT);

        // --- Glow blooms behind badge, then settles to a gentle hold ---
        tl.fromTo(".glow",
          { opacity: 0, scale: 0.5 },
          { opacity: 0.95, scale: 1.0, duration: 0.3, ease: "power3.out", immediateRender: false },
          IMPACT
        );
        tl.to(".glow", { opacity: 0.4, scale: 0.92, duration: 0.6, ease: "power2.inOut", overwrite: "auto" }, IMPACT + 0.34);

        // --- Shockwave rings expand and fade ---
        tl.fromTo(".ring.r1",
          { opacity: 0.9, scale: 0.22 },
          { opacity: 0, scale: 2.0, duration: 0.55, ease: "power2.out" },
          IMPACT + 0.02
        );
        tl.fromTo(".ring.r2",
          { opacity: 0.85, scale: 0.18 },
          { opacity: 0, scale: 2.6, duration: 0.66, ease: "power2.out" },
          IMPACT + 0.08
        );

        // --- Burst spokes shoot outward ---
        tl.fromTo(bars,
          { opacity: 0, y: 30, scaleY: 0.3 },
          { opacity: 1, y: -150, scaleY: 1, duration: 0.3, ease: "power3.out", stagger: 0.006 },
          IMPACT + 0.03
        );
        tl.to(bars, { opacity: 0, y: -320, duration: 0.34, ease: "power2.in", stagger: 0.006 }, IMPACT + 0.26);

        // --- Hold: gentle breathing + one playful wink-wobble ---
        // Breathing spans through to the composition end (3.4s) so no frame
        // ever falls past the timeline's last keyframe.
        tl.to(".badge-wrap", {
          scale: 1.025, duration: 1.075, ease: "sine.inOut", yoyo: true, repeat: 1,
        }, 1.25);
        tl.to(".badge-wrap", {
          keyframes: { rotation: [0, -2.6, 1.4, 0] }, duration: 0.5, ease: "sine.inOut",
        }, 1.55);
        // soft glow pulse, also landing exactly at 3.4s
        tl.to(".glow", { opacity: 0.5, scale: 0.98, duration: 0.95, ease: "sine.inOut", yoyo: true, repeat: 1, overwrite: "auto" }, 1.5);

        window.__timelines["root"] = tl;
      </script>
    </div>
  </body>
</html>
